# Builds the MkDocs Material library and deploys it to GitHub Pages.
#
# Security notes:
# - Triggered ONLY by push to main and manual dispatch — never by pull_request,
#   so a fork PR can neither deploy nor read the deploy token.
# - Least-privilege permissions: read the repo, write Pages, mint the OIDC
#   token deploy-pages needs. No repository secrets are used.
# - `mkdocs build --strict` fails the build on broken links or bad nav.
# - Hardening (v0.3): pin each action to a commit SHA instead of a tag.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "memory-mirror/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site (mkdocs build --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so git-revision-date-localized can read each file's last commit date.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
