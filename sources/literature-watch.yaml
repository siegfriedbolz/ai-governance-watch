# literature-watch.yaml — the single source-of-truth URL list.
#
# This is the ONLY legitimate place to add or remove a watched source.
# A change here fires the routine's native GitHub source-change trigger,
# which baselines the newly added source (see docs/routine-setup.md).
#
# Validates against sources/schema/sources.schema.json. Every URL must sit
# on the domain allowlist enforced by that schema (Appendix E hardening).
#
# Target contract since 2026-09-21 (docs/adapter-contract.md): every target has a
# `kind` (document | landing_page | news_feed | legal_search); every source has at
# least one news_feed or legal_search target, because landing pages alone missed
# six developments on 2026-09-05 and Implementing Regulation (EU) 2026/1755 on
# 2026-09-21. A source whose successor would appear under a new identifier or URL
# declares `successor_risk: true`, and each of its targets then carries a
# `watch_hint` — the page to check by hand when the fingerprint stays silent.

version: 1
paused: false

defaults:
  # Identifies the crawler and a contact, per Appendix E. Contact is the public
  # repo (open an issue) — no personal email in this public file.
  user_agent: "ai-governance-watch/0.1 (+https://github.com/siegfriedbolz/ai-governance-watch)"
  cadence: weekly

sources:
  - id: nist_ai_rmf
    domain: "NIST AI RMF"
    title: "NIST AI Risk Management Framework (AI 100-1) incl. GenAI Profile (AI 600-1) and the AI RMF Playbook"
    reference_file: reference_nist_ai_rmf.md
    license: "U.S. Government work — public domain (NIST)"
    reproduction: public-domain
    cadence: weekly
    enabled: true
    state: pilot
    successor_risk: true
    targets:
      - url: "https://github.com/usnistgov/ARIA"
        adapter: github_repo
        kind: document
        watch_hint: "ARIA is a programme repository, not the framework; a revised AI RMF never shows up here. Hand-check: https://www.nist.gov/itl/ai-risk-management-framework (\"under revision\" banner, new document number)."
        note: "NIST ARIA (Assessing Risks and Impacts of AI) programme repository — commit-level watch via GitHub API. Not the Playbook: the AI RMF Playbook is a web resource on the AI Resource Center (see the airc.nist.gov target)."
      - url: "https://airc.nist.gov/airmf-resources/playbook/"
        adapter: html_extraction
        kind: landing_page
        check_interval_days: 14
        watch_hint: "A revised Playbook or an AI RMF 2.0 would be announced here and on airc.nist.gov/ before the old URL changes; a new framework version gets a new publication number (AI 100-1 rev. or a new AI 100-x). Hand-check the AIRC home page and the NIST AI publications list when this page is silent for a full cadence."
        note: "AI RMF Playbook (interactive, living web resource on the AIRC) — the actual Playbook target; also the place a revised AI RMF would surface first."
      - url: "https://www.nist.gov/itl/ai-risk-management-framework"
        adapter: html_extraction
        kind: landing_page
        check_interval_days: 14
        watch_hint: "The landing page says the framework is under revision (White House AI Action Plan) without a date. The successor will carry a new number and a new nvlpubs URL, so this page must be read, not fingerprinted: look for a new \"AI RMF\" item, a public-comment call, or a changed version line."
        note: "AI RMF landing page — version, errata, crosswalk announcements."
      - url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"
        adapter: html_extraction
        kind: document
        watch_hint: "A revised GenAI Profile is published as a new PDF (600-1r1 or similar); this URL then stays unchanged. Hand-check: https://www.nist.gov/publications search for \"600-1\"."
        note: "GenAI Profile (AI 600-1) — frozen PDF; version metadata watch."
      - url: "https://www.nist.gov/artificial-intelligence"
        adapter: html_extraction
        kind: news_feed
        note: "NIST AI news list — new publications, comment calls and initiative announcements (CAISI, zero drafts, profiles) appear here first; compare new items against the page's Recent Changes."
        watch_hint: "The list is paginated and dated; only items newer than last_observed_at count. A revised AI RMF is announced here as a news item before any URL changes."

  - id: eu_ai_act
    domain: "EU AI Act"
    title: "Regulation (EU) 2024/1689 (Artificial Intelligence Act) and its implementing/amending acts"
    reference_file: reference_eu_ai_act.md
    license: "© European Union, EUR-Lex — reuse under Decision 2011/833/EU (attribution)"
    reproduction: open-attribution
    cadence: weekly
    enabled: true
    state: planned
    targets:
      - url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"
        adapter: eurlex_celex
        kind: document
        note: "Consolidated legal text via EUR-Lex/CELLAR — amendments, corrigenda, consolidations."
      - url: "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai"
        adapter: html_extraction
        kind: landing_page
        note: "EC policy hub — guidelines, delegated/implementing acts, timeline changes (e.g. Digital Omnibus)."
      - url: "https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX:32024R1689"
        adapter: eurlex_celex
        kind: legal_search
        note: "EUR-Lex 'all documents' view of the AI Act: lists amending acts, corrigenda and every delegated or implementing act adopted on its basis (each under its own number). New entries here are new law — the view that would have shown Implementing Regulation (EU) 2026/1755 in July 2026."
        watch_hint: "EUR-Lex answers automated clients with an AWS WAF challenge (HTTP 202, empty body) — never bypass it; read the view in the browser pane, or resolve a new act through the Publications Office Cellar (publications.europa.eu/resource/celex/<CELEX>)."
      - url: "https://digital-strategy.ec.europa.eu/en/news"
        adapter: html_extraction
        kind: news_feed
        note: "Commission digital-strategy news list — AI Act guidelines, codes of practice, enforcement announcements and AI Office releases; compare new AI items against the page's Recent Changes."
      - url: "https://digital-strategy.ec.europa.eu/en/policies/enforcement-ai-act"
        adapter: html_extraction
        kind: landing_page
        note: "Enforcement framework page — AI Office tools (complaints, whistleblower, downstream-provider channel), requests for information, proceedings under Art. 92/101 and Implementing Regulation (EU) 2026/1755."

  - id: iso_42001
