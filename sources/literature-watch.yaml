        kind: landing_page
        watch_hint: "Browser-only treaty chart (SPA); the status is stated on the coe_ai_convention page only. Read it in the browser pane and store the \"status as of\" date; a Swiss ratification appears as a date in the Switzerland row."
        note: "CoE treaty chart for CETS 225 — signatures, ratifications, entry into force. SPA, browser only; quote the 'status as of' date."

