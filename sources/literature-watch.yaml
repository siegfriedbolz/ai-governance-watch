        adapter: iso_metadata
        kind: landing_page
        watch_hint: "A new edition or an amendment (AMD 1) gets its own catalogue number and page; this page then only changes its stage code. Hand-check the SC 42 committee page and the CEN-CENELEC JTC 21 news for EN adoption and OJ citation as a harmonised standard."
        note: "Catalogue metadata only (title, edition, status, stage). Full text is paywalled — never fetched."
      - url: "https://www.iso.org/committee/6794475.html"
        adapter: iso_metadata
        kind: news_feed
        note: "ISO/IEC JTC 1/SC 42 committee page — published standards and work programme; a revision of 42001 or a new 42000-series document appears here as a work item before publication."
        watch_hint: "The committee list is metadata only; a new work item has a new standard number, so compare the list against the 42000-series items already on the page."

