        adapter: html_extraction
        kind: landing_page
        check_interval_days: 30
        watch_hint: "admin.ch refuses automated clients (HTTP 403); the consultation draft due end of 2026 will be published under a new fedlex.admin.ch consultation URL. Hand-check in the browser pane: this page, the EJPD/BJ news and the Fedlex consultations list."
        note: "Federal Chancellery AI-regulation page — where the consultation draft (due end of 2026) will be announced. admin.ch refuses automated clients (HTTP 403): needs a browser-based fetch or a manual check; raise cadence to weekly once the consultation opens."
